        const app = document.getElementById('app');
        const toast = document.getElementById('toast');
        let remoteJobs = [];
        let jobsLoaded = false;
        let jobsLoadError = '';

        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[ch]));
        }

        function slugify(value) {
            return String(value || 'job').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'job';
        }

        function getSavedArray(key) {
            try {
                const saved = JSON.parse(localStorage.getItem(key) || '[]');
                return Array.isArray(saved) ? saved : [];
            } catch (error) {
                return [];
            }
        }

        function saveArray(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
        }

        function getJobs() {
            const allJobs = [...defaultJobs, ...remoteJobs, ...getSavedArray(CUSTOM_JOBS_KEY)];
            const seen = new Set();
            return allJobs.filter(job => {
                if (seen.has(job.id)) return false;
                seen.add(job.id);
                return true;
            });
        }

        function getJobById(id) {
            return getJobs().find(job => job.id === id);
        }

        // ✅ GET jobs from TiDB via Netlify Function
        async function loadRemoteJobs(force = false) {
            if (jobsLoaded && !force) return;
            try {
                const response = await fetch(GET_JOBS_ENDPOINT, { cache: 'no-store' });
                if (!response.ok) throw new Error(`Server error: ${response.status}`);
                const data = await response.json();
                remoteJobs = Array.isArray(data.jobs) ? data.jobs : [];
                jobsLoadError = '';
            } catch (error) {
                console.warn('Unable to load shared jobs.', error);
                jobsLoadError = 'Could not load jobs from database. Showing default jobs.';
                remoteJobs = [];
            } finally {
                jobsLoaded = true;
            }
        }

        // ✅ POST new job to TiDB via Netlify Function
        async function saveJobToDatabase(job) {
            const response = await fetch(ADD_JOB_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(job)
            });
            if (!response.ok) throw new Error(`Server error: ${response.status}`);
            return await response.json();
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2600);
        }

                    <span>${escapeHtml(item)}</span>

            `).join('');
        }

                        <div class="w-10 h-10 rounded-lg bg-green-100 text-green-600 flex items-center justify-center">
                            <i class="fas fa-user-plus"></i>
                        </div>
                        <div>
                            <h2 class="text-xl font-extrabold text-slate-900">Developer Application Form</h2>
                            <p class="text-xs text-slate-500">Application will be saved for this job.</p>
                        </div>
                    </div>
                    <form id="apply-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="hidden" id="apply-job-id" value="${escapeHtml(job.id)}">
                        <label class="text-sm font-bold text-slate-700">Developer Name
                            <input id="apply-name" required class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 font-normal focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="Your name">
                        </label>
                        <label class="text-sm font-bold text-slate-700">Email
                            <input id="apply-email" type="email" required class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 font-normal focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="you@example.com">
                        </label>
                        <label class="text-sm font-bold text-slate-700">Phone / WhatsApp
                            <input id="apply-phone" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 font-normal focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="+91 ...">
                        </label>
                        <label class="text-sm font-bold text-slate-700">Experience
                            <input id="apply-exp" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 font-normal focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="3 years">
                        </label>
                        <label class="text-sm font-bold text-slate-700 md:col-span-2">Skills
                            <input id="apply-skills" required class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 font-normal focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="React.js, Node.js, MongoDB">
                        </label>
                        <label class="text-sm font-bold text-slate-700 md:col-span-2">Resume Link
                            <input id="apply-resume" type="url" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 font-normal focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="https://...">
                        </label>
                        <label class="text-sm font-bold text-slate-700 md:col-span-2">Message
                            <textarea id="apply-message" rows="4" class="mt-1 w-full border border-slate-300 rounded-lg px-3 py-2 font-normal focus:outline-none focus:ring-2 focus:ring-green-400 resize-none" placeholder="Short note for Signimus"></textarea>
                        </label>
                        <div class="md:col-span-2 flex flex-col sm:flex-row justify-end gap-3">
                            <a href="mailto:${escapeHtml(job.applyEmail || 'contact@signimus.com')}?subject=Application for ${encodeURIComponent(job.title)}" class="inline-flex items-center justify-center gap-2 px-5 py-3 bg-indigo-600 text-white rounded-lg text-sm font-bold hover:bg-indigo-700">
                                <i class="fas fa-envelope"></i> Apply via Email
                            </a>
                            <button type="submit" class="inline-flex items-center justify-center gap-2 px-5 py-3 bg-green-500 text-white rounded-lg text-sm font-bold hover:bg-green-600">
                                <i class="fas fa-paper-plane"></i> Save Application
                            </button>
                        </div>
                    </form>
                </section>
            `;
            document.getElementById('apply-form').addEventListener('submit', handleApply);
            if (focusApply) {
                setTimeout(() => document.getElementById('apply')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
            }
        }

        function splitLines(value) {
            return String(value || '').split('\n').map(line => line.trim()).filter(Boolean);
        }

        async function handleAddJob(event) {
            event.preventDefault();
            const form = event.target;
            const submitButton = form.querySelector('button[type="submit"]');
            const title = document.getElementById('job-title').value.trim();
            if (!title) return;

            const badge = document.getElementById('job-badge').value || 'Open';
            const badgeColor = badge === 'Urgent' ? 'bg-red-100 text-red-600' : badge === 'Hiring' ? 'bg-green-100 text-green-600' : 'bg-blue-100 text-blue-600';

            const job = {
                title,
                type: document.getElementById('job-type').value.trim() || 'Full-Time / Remote',
                experience: document.getElementById('job-exp').value.trim() || 'Experience flexible',
                location: document.getElementById('job-location').value.trim() || 'Remote (India)',
                badge,
                badgeColor,
                iconClass: 'fas fa-briefcase',
                summary: document.getElementById('job-summary').value.trim() || 'New hiring requirement.',
                responsibilities: splitLines(document.getElementById('job-responsibilities').value).slice(0, 10),
                requirements: splitLines(document.getElementById('job-requirements').value).slice(0, 10),
                salary: document.getElementById('job-salary').value.trim() || 'On Request',
                applyEmail: 'contact@signimus.com',
            };

            if (job.responsibilities.length === 0) job.responsibilities = ['Role responsibilities will be discussed during screening.'];
            if (job.requirements.length === 0) job.requirements = ['Relevant experience and strong communication skills.'];

            submitButton.disabled = true;
            submitButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

            try {
                await saveJobToDatabase(job);
                showToast('Job saved to database! Visible everywhere.');
                form.reset();
                jobsLoaded = false;
                await loadRemoteJobs(true);
                renderJobsList();
            } catch (error) {
                console.warn('Database save failed. Saving to localStorage.', error);
                const customJobs = getSavedArray(CUSTOM_JOBS_KEY);
                const localJob = { ...job, id: `${slugify(title)}-${Date.now().toString(36)}`, createdAt: Date.now() };
                customJobs.push(localJob);
                saveArray(CUSTOM_JOBS_KEY, customJobs);
                showToast('Database unavailable. Job saved locally only.');
                renderJobsList();
            } finally {
                submitButton.disabled = false;
                submitButton.innerHTML = '<i class="fas fa-plus"></i> Save Job';
            }
        }

        function handleApply(event) {
            event.preventDefault();
            const jobId = document.getElementById('apply-job-id').value;
            const applications = getSavedArray(JOB_APPLICATIONS_KEY);
            applications.push({
                id: `application-${Date.now().toString(36)}`,
                jobId,
                jobTitle: getJobById(jobId)?.title || '',
                name: document.getElementById('apply-name').value.trim(),
                email: document.getElementById('apply-email').value.trim(),
                phone: document.getElementById('apply-phone').value.trim(),
                experience: document.getElementById('apply-exp').value.trim(),
                skills: document.getElementById('apply-skills').value.trim(),
                resume: document.getElementById('apply-resume').value.trim(),
                message: document.getElementById('apply-message').value.trim(),
                appliedAt: Date.now()
            });
            saveArray(JOB_APPLICATIONS_KEY, applications);
            event.target.reset();
            showToast('Application saved!');
        }

        async function router() {
            await loadRemoteJobs();
            const hash = window.location.hash.replace(/^#/, '');
            const applyMatch = hash.match(/^job-(.+)-apply$/);
            const detailMatch = hash.match(/^job-(.+)$/);
            if (applyMatch) {
                const job = getJobById(applyMatch[1]);
                if (job) renderJobDetail(job, true); else renderJobsList();
                return;
            }
            if (detailMatch) {
                const job = getJobById(detailMatch[1]);
                if (job) renderJobDetail(job, false); else renderJobsList();
                return;
            }
            renderJobsList();
        }

        window.addEventListener('hashchange', router);
        window.addEventListener('DOMContentLoaded', router);
    </script>
</body>
</html>
